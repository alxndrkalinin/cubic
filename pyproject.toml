[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cubic"
dynamic = ["version"]
description = "CUDA-accelerated 3D BioImage Computing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Kalinin", email = "alxndrkalinin@gmail.com" }
]
dependencies = [
    "numpy>=1.20.0",
    # >=0.25 for morphology.footprint_rectangle, which replaces square/cube
    # (removed in 0.27) and is the only variant cuCIM provides.
    "scikit-image>=0.25",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/alxndrkalinin/cubic"
Repository = "https://github.com/alxndrkalinin/cubic"

[project.optional-dependencies]
cellpose = [
    "cellpose>=4.2.0",
    "torch",
]
mesh = [
    "trimesh>=3.3.0",
    "rtree>=1.0",  # trimesh curvature: mesh.face_adjacency_tree
]
plot = [
    "matplotlib>=3.5",
]
examples = [
    "jupyter",
    "pooch",
]
dev = [
    "ruff",
    "mypy",
    "pooch",
    "pytest",
    "pre-commit",
]
# GPU support: pick the extra matching the CUDA major version the driver
# supports. [ctk] pulls the CUDA runtime libraries from PyPI, so only the
# driver is needed. Not part of `all`, since the two are mutually exclusive.
cuda12 = [
    "cupy-cuda12x[ctk]>=14",  # 13.x has no [ctk] extra
    "cucim-cu12",
]
cuda13 = [
    "cupy-cuda13x[ctk]>=14",
    "cucim-cu13",
]
all = [
    "cubic[cellpose]",
    "cubic[mesh]",
    "cubic[plot]",
    "cubic[examples]",
    "cubic[dev]",
]

[tool.uv]
conflicts = [
    [{ extra = "cuda12" }, { extra = "cuda13" }],
]

[tool.setuptools.dynamic]
version = { attr = "cubic.__version__" }

[tool.setuptools.packages.find]
exclude = ["examples*"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
exclude = ["examples/scripts/*.py"]

[tool.ruff.lint]
# "F" (pyflakes) catches unused imports/variables, which previously accumulated
# unnoticed. Example notebooks are authored content, so they only get the
# import-order and docstring rules.
select = ["D", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.ipynb" = ["F401", "F541"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
length-sort = true
