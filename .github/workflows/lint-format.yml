name: CI

on: [push, pull_request]

jobs:
  lint:
    name: lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: set up python
        run: uv python install 3.10

      - name: install project with dev dependencies
        run: uv sync --extra dev

      - name: run ruff linter
        run: uv run ruff check .

      - name: run ruff formatter check
        run: uv run ruff format --check .

      - name: run mypy
        run: uv run mypy --ignore-missing-imports cubic/

  test:
    name: test on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: set up python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Test modules for an optional extra skip at import without it. cellpose
      # stays out: it pulls in torch, and its tests mostly need a GPU anyway.
      - name: install project with dev, mesh and plot dependencies
        run: uv sync --extra dev --extra mesh --extra plot

      - name: run tests
        run: uv run pytest
